# Nginx reverse proxy for Tempo.
# The WebSocket upgrade headers are mandatory: without them the STOMP/SockJS
# handshake at /ws fails and realtime availability stops working.

server {
    listen 80;
    server_name _;

    # Optional: cap request body size for the API.
    client_max_body_size 1m;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;

        # --- WebSocket upgrade (required for /ws STOMP over SockJS) ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # --- Standard proxy headers ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections are long-lived; don't cut them off early.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
