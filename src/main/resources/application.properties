spring.application.name=tempo

# --- PostgreSQL ---
# DATABASE_URL must be a JDBC URL, e.g. jdbc:postgresql://host/db?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate never alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Redis ---
spring.data.redis.url=${REDIS_URL}

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiry-ms=${JWT_EXPIRY_MS:900000}
app.jwt.refresh-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# --- Application ---
app.availability.cache-ttl-seconds=${AVAILABILITY_CACHE_TTL_SECONDS:30}
app.waitlist.hold-seconds=${WAITLIST_HOLD_SECONDS:120}
app.waitlist.sweep-ms=${WAITLIST_SWEEP_MS:10000}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.datasource.hikari.connection-timeout=5000

# --- Development seeding (only used under the 'setup' profile) ---
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}

# --- Server ---
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

# --- Logging ---
logging.level.com.tempoapi=INFO
