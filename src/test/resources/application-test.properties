# Testcontainers Postgres via the special JDBC URL scheme.
# H2 is deliberately NOT used: the schema requires btree_gist, tstzrange and a
# GiST exclusion constraint, none of which H2 supports.
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///tempo?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis host/port are injected by AbstractIntegrationTest from a Testcontainers
# Redis instance via @DynamicPropertySource.

# Test-only JWT secret (256-bit). Not a production credential.
app.jwt.secret=test-secret-test-secret-test-secret-test-secret-0123456789
app.jwt.access-expiry-ms=900000
app.jwt.refresh-expiry-ms=604800000

app.base-url=http://localhost:8080
app.availability.cache-ttl-seconds=30

logging.level.com.tempoapi=INFO
logging.level.org.testcontainers=WARN
logging.level.org.flywaydb=INFO
